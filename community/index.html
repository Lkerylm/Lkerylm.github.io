	(function () {
		if (window.__animeSoundsInit) return;
		window.__animeSoundsInit = true;

		var STORAGE_KEY = "anime-sound-enabled";
		var FILES = {
			click: "/sounds/ui/click.wav",
			tap: "/sounds/ui/tap.wav",
			login: "/sounds/ui/login.wav",
			logout: "/sounds/ui/logout.wav",
			success: "/sounds/ui/success.wav",
			error: "/sounds/ui/error.wav",
			notification: "/sounds/ui/notification.wav",
			open: "/sounds/ui/open.wav",
			close: "/sounds/ui/close.wav",
		};

		var enabled = true;
		try {
			enabled = localStorage.getItem(STORAGE_KEY) !== "false";
		} catch (e) {}

		var cache = {};

		function getAudio(name) {
			if (cache[name]) return cache[name];
			var audio = new Audio(FILES[name] || FILES.click);
			audio.preload = "auto";
			cache[name] = audio;
			return audio;
		}

		function play(name, volume) {
			if (!enabled) return null;
			try {
				var src = getAudio(name);
				var audio = src.cloneNode(true);
				audio.volume = typeof volume === "number" ? volume : 0.3;
				var p = audio.play();
				if (p && p.catch) p.catch(function () {});
				return audio;
			} catch (e) {
				return null;
			}
		}

		function syncUi() {
			var toggle = document.getElementById("anime-sound-toggle");
			var icon = document.getElementById("anime-sound-icon");
			var text = document.getElementById("anime-sound-text");
			if (!toggle) return;
			toggle.classList.toggle("is-off", !enabled);
			toggle.setAttribute("aria-pressed", String(enabled));
			if (icon) icon.textContent = enabled ? "🎵" : "🔇";
			if (text) text.textContent = enabled ? "音效开" : "音效关";
		}

		function setEnabled(value) {
			enabled = Boolean(value);
			try {
				localStorage.setItem(STORAGE_KEY, String(enabled));
			} catch (e) {}
			syncUi();
			if (enabled) play("open", 0.25);
		}

		window.AnimeSounds = {
			play: play,
			setEnabled: setEnabled,
			isEnabled: function () {
				return enabled;
			},
			toggle: function () {
				setEnabled(!enabled);
				return enabled;
			},
		};

		// 全局点击音效（捕获阶段，保证动态元素也能生效）
		// 覆盖：导航、按钮、链接、标签、分类、分页、目录、卡片等所有可点击元素
		var nearMotion =
			window.matchMedia &&
			window.matchMedia("(prefers-reduced-motion: reduce)").matches;
		var SPARKS = ["✨", "💖", "🌸", "⭐", "🎀", "💫"];
		var lastSpark = 0;

		function sparkle(x, y) {
			if (nearMotion) return;
			var now = Date.now();
			if (now - lastSpark < 70) return;
			lastSpark = now;
			var el = document.createElement("span");
			el.className = "anime-click-spark";
			el.textContent = SPARKS[Math.floor(Math.random() * SPARKS.length)];
			el.style.left = x + "px";
			el.style.top = y + "px";
			el.style.setProperty(
				"--spark-x",
				Math.round(Math.random() * 52 - 26) + "px",
			);
			document.body.appendChild(el);
			setTimeout(function () {
				el.remove();
			}, 720);
		}

		document.addEventListener(
			"click",
			function (event) {
				var target = event.target;
				if (!target || !target.closest) return;
				if (
					target.closest(
						"#anime-sound-toggle, [data-no-sound], input, textarea, select, option",
					)
				) {
					return;
				}
				var el = target.closest(
					'[data-sound], a, button, [role="button"], [role="tab"], .btn, .btn-regular, .btn-plain, .btn-ghost, .btn-primary, .floating-btn, summary, label[for], .tab, .nav-item, .post-card-wrapper',
				);
				if (!el) return;

				var custom = el.getAttribute && el.getAttribute("data-sound");
				var isButton = el.matches(
					'button, [role="button"], [role="tab"], .btn, .btn-regular, .btn-plain, .btn-ghost, .btn-primary, .floating-btn',
				);
				play(custom || (isButton ? "click" : "tap"), isButton ? 0.22 : 0.18);

				var rect =
					target.getBoundingClientRect && target.getBoundingClientRect();
				sparkle(
					event.clientX ||
						(rect ? rect.left + rect.width / 2 : window.innerWidth / 2),
					event.clientY ||
						(rect ? rect.top + rect.height / 2 : window.innerHeight / 2),
				);
			},
			true,
		);

		function bindToggle() {
			var toggle = document.getElementById("anime-sound-toggle");
			if (!toggle || toggle.dataset.bound === "1") return;
			toggle.dataset.bound = "1";
			syncUi();
			toggle.addEventListener("click", function (event) {
				event.stopPropagation();
				if (window.AnimeSounds) window.AnimeSounds.toggle();
			});
			toggle.addEventListener("keydown", function (event) {
				if (event.key === "Enter" || event.key === " ") {
					event.preventDefault();
					if (window.AnimeSounds) window.AnimeSounds.toggle();
				}
			});
		}

		if (document.readyState === "loading") {
			document.addEventListener("DOMContentLoaded", bindToggle);
		} else {
			bindToggle();
		}
		document.addEventListener("swup:page:view", bindToggle);
	})();

</em> </div> <div class="awg-grid" data-awg-grid="mobile"> <button type="button" class="awg-tile" data-awg-kind="mobile" data-awg-index="0" data-awg-tone="light" title="樱落少女" aria-label="樱落少女"> <img src="/anime-wallpaper/thumbs/mobile-01.avif" alt="樱落少女" loading="lazy" decoding="async">  <span class="awg-tile-index">1</span> </button><button type="button" class="awg-tile" data-awg-kind="mobile" data-awg-index="11" data-awg-tone="night" title="樱落少女 · 夜" aria-label="樱落少女 · 夜"> <img src="/anime-wallpaper/thumbs/mobile-12.avif" alt="樱落少女 · 夜" loading="lazy" decoding="async"> <span class="awg-tile-moon">🌙</span> <span class="awg-tile-index">12</span> </button><button type="button" class="awg-tile" data-awg-kind="mobile" data-awg-index="1" data-awg-tone="light" title="星空少女" aria-label="星空少女"> <img src="/anime-wallpaper/thumbs/mobile-02.avif" alt="星空少女" loading="lazy" decoding="async">  <span class="awg-tile-index">2</span> </button><button type="button" class="awg-tile" data-awg-kind="mobile" data-awg-index="12" data-awg-tone="night" title="星空少女 · 夜" aria-label="星空少女 · 夜"> <img src="/anime-wallpaper/thumbs/mobile-13.avif" alt="星空少女 · 夜" loading="lazy" decoding="async"> <span class="awg-tile-moon">🌙</span> <span class="awg-tile-index">13</span> </button><button type="button" class="awg-tile" data-awg-kind="mobile" data-awg-index="2" data-awg-tone="light" title="雪夜灯火" aria-label="雪夜灯火"> <img src="/anime-wallpaper/thumbs/mobile-03.avif" alt="雪夜灯火" loading="lazy" decoding="async">  <span class="awg-tile-index">3</span> </button><button type="button" class="awg-tile" data-awg-kind="mobile" data-awg-index="13" data-awg-tone="night" title="雪夜灯火 · 夜" aria-label="雪夜灯火 · 夜"> <img src="/anime-wallpaper/thumbs/mobile-14.avif" alt="雪夜灯火 · 夜" loading="lazy" decoding="async"> <span class="awg-tile-moon">🌙</span> <span class="awg-tile-index">14</span> </button><button type="button" class="awg-tile" data-awg-kind="mobile" data-awg-index="3" data-awg-tone="light" title="雨伞小径" aria-label="雨 ata-awg-kind="mobile" data-awg-index="17" data-awg-tone="night" title="粉樱插画 · 夜" aria-label="粉樱插画 · 夜"> <img src="/anime-wallpaper/thumbs/mobile-18.avif" alt="粉樱插画 · 夜" loading="lazy" decoding="async"> <span class="awg-tile-moon">🌙</span> <span class="awg-tile-index">18</span> </button><button type="button" class="awg-tile" data-awg-kind="mobile" data-awg-index="7" data-awg-tone="light" title="夏日泳装" aria-label="夏日泳装"> <img src="/anime-wallpaper/thumbs/mobile-08.avif" alt="夏日泳装" loading="lazy" decoding="async">  <span class="awg-tile-index">8</span> </button><button type="button" class="awg-tile" data-awg-kind="mobile" data-awg-index="18" data-awg-tone="night" title="夏日泳装 · 夜" aria-label="夏日泳装 · 夜"> <img src="/anime-wallpaper/thumbs/mobile-19.avif" alt="夏日泳装 · 夜" loading="lazy" decoding="async"> <span class="awg-tile-moon">🌙</span> <span class="awg-tile-index">19</span> </button><button type="button" class="awg-tile" data-awg-kind="mobile" data-awg-index="8" data-awg-tone="light" title="黄昏屋顶" aria-label="黄昏屋顶"> <img src="/anime-wallpaper/thumbs/mobile-09.avif" alt="黄昏屋顶" loading="lazy" decoding="async">  <span class="awg-tile-index">9</span> </button><button type="button" class="awg-tile" data-awg-kind="mobile" data-awg-index="19" data-awg-tone="night" title="黄昏屋顶 · 夜" aria-label="黄昏屋顶 · 夜"> <img src="/anime-wallpaper/thumbs/mobile-20.avif" alt="黄昏屋顶 · 夜" loading="lazy" decoding="async"> <span class="awg-tile-moon">🌙</span> <span class="awg-tile-index">20</span> </button><button type="button" class="awg-tile" data-awg-kind="mobile" data-awg-index="9" data-awg-tone="light" title="花火夜" aria-label="花火夜"> <img src="/anime-wallpaper/thumbs/mobile-10.avif" alt="花火夜" loading="lazy" decoding="async">  <span class="awg-tile-index">10</span> </button><button type="button" class="awg-tile" data-awg-kind="mobile" data-awg-index="20" data-awg-tone="night" title="花火夜 · 夜" aria-label="花火夜 · 夜"> <img src="/anime-wallpaper/thumbs/mobile-21.avif" alt="花火夜 · 夜" loading="lazy" decoding="async"> <span class="awg-tile-moon">🌙</span> <span class="awg-tile-index">21</span> </button><button type="button" class="awg-tile" data-awg-kind="mobile" data-awg-index="10" data-awg-tone="light" title="海风轻语" aria-label="海风轻语"> <img src="/anime-wallpaper/thumbs/mobile-11.avif" alt="海风轻语" loading="lazy" decoding="async">  <span class="awg-tile-index">11</span> </button><button type="button" class="awg-tile" data-awg-kind="mobile" data-awg-index="21" data-awg-tone="night" title="海风轻语 · 夜" aria-label="海风轻语 · 夜"> <img src="/anime-wallpaper/thumbs/mobile-22.avif" alt="海风轻语 · 夜" loading="lazy" decoding="async"> <span class="awg-tile-moon">🌙</span> <span class="awg-tile-index">22</span> </button> </div> </div> <div class="awg-foot"> <button id="awg-random" type="button" class="awg-btn">🎲 随机一张</button>  <button id="awg-reset" type="button" class="awg-btn awg-btn-ghost">恢复默认</button> </div> <div class="awg-tip">共 44 张动漫壁纸（夜色 22 张）· 全部离线可用</div> </div> <!-- 页面背景：往下滚动也能看到动漫壁纸 --> <div id="anime-page-bg" aria-hidden="true"> <img id="anime-page-bg-img" src="/anime-wallpaper/desktop-01.avif" alt=""> <div class="anime-page-bg-veil"></div> <div class="anime-page-bg-glow"></div> </div> <div id="anime-fullwall-layer" aria-hidden="true"> <img id="anime-fullwall-img" src="/anime-wallpaper/desktop-01.avif" alt=""> <div class="anime-fullwall-veil"></div> </div>  <script>
	(function () {
		if (window.__animeWallpaperGalleryInit) return;
		window.__animeWallpaperGalleryInit = true;

		var KEY_D = "anime-wallpaper-desktop";
		var KEY_M = "anime-wallpaper-mobile";
		var KEY_FULL = "anime-wallpaper-fullwall";

		function read(key, fallback) {
			try {
				var v = localStorage.getItem(key);
				return v === null ? fallback : v;
			} catch (e) {
				return fallback;
			}
		}
		function write(key, value) {
			try {
				localStorage.setItem(key, String(value));
			} catch (e) {}
		}
		function isMobile() {
			return window.matchMedia("(max-width: 860px)").matches;
		}
		function pad2(n) {
			return (n < 9 ? "0" : "") + (n + 1);
		}
		function pathOf(kind, index) {
			return "/anime-wallpaper/" + kind + "-" + pad2(index) + ".avif";
		}
		function tilesOf(kind) {
			return document.querySelectorAll('[data-awg-kind="' + kind + '"]');
		}
		function tileCount(kind) {
			return tilesOf(kind).length || 22;
		}
		function toIndex(value, count) {
			var n = parseInt(value, 10);
			if (isNaN(n) || n < 0) n = 0;
			return n % count;
		}
		function currentIndex(kind) {
			return toIndex(read(kind === "mobile" ? KEY_M : KEY_D, 0), tileCount(kind));
		}
		function hasPick(kind) {
			try {
				return localStorage.getItem(kind === "mobile" ? KEY_M : KEY_D) !== null;
			} catch (e) {
				return false;
			}
		}
		function fallbackIndex(kind) {
			// 没选过壁纸时，本次会话随机挑一张（保持整站一致）
			var store = window.__animePageBgRandom || (window.__animePageBgRandom = {});
			if (store[kind] === undefined) {
				store[kind] = Math.floor(Math.random() * tileCount(kind));
			}
			return store[kind];
		}

		function els() {
			return {
				panel: document.getElementById("anime-wallpaper-panel"),
				open: document.getElementById("anime-wallpaper-open"),
				full: document.getElementById("awg-fullwall"),
				layerImg: document.getElementById("anime-fullwall-img"),
				pageImg: document.getElementById("anime-page-bg-img"),
			};
		}

		// 全屏层：始终跟随「当前设备」那一套壁纸
		function applyFullwallImage(kind, index) {
			var e = els();
			if (!e.layerImg) return;
			var src = pathOf(kind, index);
			if (e.layerImg.getAttribute("src") !== src) e.layerImg.src = src;
		}

		// 页面背景层：跟随当前设备 + 保存的选择
		function applyPageBg(kind, index) {
			var e = els();
			if (!e.pageImg) return;
			var src = pathOf(kind, index);
			if (e.pageImg.getAttribute("src") === src) return;
			e.pageImg.style.opacity = "0";
			setTimeout(function () {
				e.pageImg.src = src;
				e.pageImg.style.opacity = "";
			}, 140);
		}

		// 独立二次元页面：直接换背景图（带淡入过渡）
		function applyStandalone(src) {
			var bg = document.getElementById("anime-backdrop-img");
			if (!bg) return;
			if (bg.getAttribute("src") === src) return;
			bg.style.opacity = "0";
			setTimeout(function () {
				bg.src = src;
				bg.style.opacity = "";
			}, 160);
		}

		function syncTiles() {
			var tiles = document.querySelectorAll("[data-awg-kind]");
			for (var i = 0; i < tiles.length; i++) {
				var tile = tiles[i];
				var kind = tile.getAttribute("data-awg-kind");
				var index = parseInt(tile.getAttribute("data-awg-index"), 10);
				tile.classList.toggle("is-active", hasPick(kind) && index === currentIndex(kind));
			}
		}

		function syncFilters() {
			var chips = document.querySelectorAll("[data-awg-filter]");
			var mode = window.__animeWallpaperFilter || "all";
			for (var i = 0; i < chips.length; i++) {
				var on = chips[i].getAttribute("data-awg-filter") === mode;
				chips[i].classList.toggle("is-on", on);
				chips[i].setAttribute("aria-selected", on ? "true" : "false");
			}
			var tiles = document.querySelectorAll("[data-awg-kind]");
			for (var j = 0; j < tiles.length; j++) {
				var tile = tiles[j];
				var kind = tile.getAttribute("data-awg-kind");
				var tone = tile.getAttribute("data-awg-tone");
				var show = mode === "all" || mode === kind || (mode === "night" && tone === "night");
				if (show) tile.removeAttribute("hidden");
				else tile.setAttribute("hidden", "");
			}
			var groups = document.querySelectorAll("[data-awg-group]");
			for (var k = 0; k < groups.length; k++) {
				var g = groups[k];
				var visible = g.querySelector("[data-awg-kind]:not([hidden])");
				g.style.display = visible ? "" : "none";
			}
		}

		function syncFull() {
			var on = read(KEY_FULL, "0") === "1";
			document.documentElement.setAttribute("data-anime-fullwall", on ? "1" : "0");
			var e = els();
			if (e.full) e.full.setAttribute("aria-checked", on ? "true" : "false");
		}

		function deviceKind() {
			return isMobile() ? "mobile" : "desktop";
		}

		function pick(kind, index) {
			write(kind === "mobile" ? KEY_M : KEY_D, index);
			// 全屏层 / 页面背景只跟「当前设备」这一套走，
			// 否则在电脑上点竖屏壁纸会让整页背景变成竖图（随机一张时尤其明显）
			var device = deviceKind();
			var deviceIndex = kind === device ? index : currentIndex(device);
			if (typeof window.__animeWallpaperApply === "function") {
				try {
					window.__animeWallpaperApply(kind, index);
				} catch (e) {}
			} else if (kind === device) {
				applyStandalone(pathOf(device, deviceIndex));
			}
			applyFullwallImage(device, deviceIndex);
			applyPageBg(device, deviceIndex);
			syncTiles();
			if (window.AnimeSounds) window.AnimeSounds.play("open", 0.2);
		}

		function randomPick() {
			var kinds = ["desktop", "mobile"];
			for (var i = 0; i < kinds.length; i++) {
				var kind = kinds[i];
				pick(kind, Math.floor(Math.random() * tileCount(kind)));
			}
			if (window.AnimeCursor) window.AnimeCursor.say("🎲 换了一组新壁纸～");
		}

		function resetPicks() {
			try {
				localStorage.removeItem(KEY_D);
				localStorage.removeItem(KEY_M);
				localStorage.removeItem(KEY_FULL);
			} catch (e) {}
			window.__animePageBgRandom = {};
			syncFull();
			randomPick();
		}

		// 页面加载 / swup 切页后：把保存的选择重新贴回页面
		function restore() {
			syncFull();
			syncFilters();
			syncTiles();
			var deviceKind = isMobile() ? "mobile" : "desktop";
			var kinds = ["desktop", "mobile"];
			for (var i = 0; i < kinds.length; i++) {
				var kind = kinds[i];
				var index = hasPick(kind) ? currentIndex(kind) : fallbackIndex(kind);
				if (hasPick(kind)) {
					if (typeof window.__animeWallpaperApply === "function") {
						try {
							window.__animeWallpaperApply(kind, index);
						} catch (e) {}
					} else if (kind === deviceKind) {
						applyStandalone(pathOf(kind, index));
					}
				}
				applyFullwallImage(kind, index);
				if (kind === deviceKind) applyPageBg(kind, index);
			}
		}

		function openPanel(open) {
			var e = els();
			if (!e.panel) return;
			e.panel.classList.toggle("is-open", open);
			if (e.open) e.open.setAttribute("aria-expanded", open ? "true" : "false");
			if (open && window.AnimeSounds) window.AnimeSounds.play("open", 0.2);
		}

		document.addEventListener(
			"click",
			function (event) {
				var target = event.target;
				if (!target || !target.closest) return;
				var e = els();

				if (target.closest("#anime-wallpaper-open")) {
					openPanel(!(e.panel && e.panel.classList.contains("is-open")));
					return;
				}
				if (target.closest("#awg-close")) {
					openPanel(false);
					return;
				}
				var chip = target.closest("[data-awg-filter]");
				if (chip) {
					window.__animeWallpaperFilter = chip.getAttribute("data-awg-filter");
					syncFilters();
					if (window.AnimeSounds) window.AnimeSounds.play("click", 0.16);
					return;
				}
				var tile = target.closest("[data-awg-kind]");
				if (tile) {
					pick(
						tile.getAttribute("data-awg-kind"),
						parseInt(tile.getAttribute("data-awg-index"), 10) || 0,
					);
					return;
				}
				if (target.closest("#awg-random")) {
					randomPick();
					return;
				}
				if (target.closest("#awg-fullwall")) {
					var on = read(KEY_FULL, "0") === "1";
					write(KEY_FULL, on ? "0" : "1");
					syncFull();
					var kind = isMobile() ? "mobile" : "desktop";
					applyFullwallImage(kind, currentIndex(kind));
					if (window.AnimeSounds) window.AnimeSounds.play("click", 0.2);
					return;
				}
				if (target.closest("#awg-reset")) {
					resetPicks();
					return;
				}
				if (
					e.panel &&
					e.panel.classList.contains("is-open") &&
					!target.closest("#anime-wallpaper-panel")
				) {
					openPanel(false);
				}
			},
			true,
		);

		document.addEventListener("keydown", function (event) {
			if (event.key === "Escape") openPanel(false);
		});

		var resizeTimer = null;

        </a>`;
      }).join('');
    })();
  </script> </body> </html>
