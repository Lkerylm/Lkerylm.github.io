name: Deploy to Pages Branch

on:
  # 每次推送到主分支时触发（GitHub 默认分支可能是 main 或 master）
  push:
    branches: [ master, main ]
  # 允许你在 GitHub 上的 Actions 标签中手动触发此"工作流程"
  workflow_dispatch:

# 需要写入权限来推送到pages分支
permissions:
  contents: write

# 站点地址：仓库 Settings → Secrets and variables → Actions → Variables 里新增 SITE_URL
# 例如 https://你的用户名.github.io 或 https://你的域名
# 注意：本工作流只适用于「用户名.github.io」仓库或绑定了自定义域名的 Pages；
#       普通项目仓库（/仓库名/ 路径）请改用 Vercel 部署，见 DEPLOY.md
env:
  SITE_URL: ${{ vars.SITE_URL }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
          run_install: false
          
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      
      - name: Build site
        run: pnpm run build

      - name: Create .nojekyll file
        run: touch dist/.nojekyll
      
      - name: Deploy to pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: pages # 部署到pages分支
          folder: dist # Astro默认构建输出目录
          clean: true # 清理目标分支中的旧文件
